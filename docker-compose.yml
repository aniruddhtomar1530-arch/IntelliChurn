services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: intellchurn
      POSTGRES_USER: intellchurn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Compose}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellchurn -d intellchurn"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://intellchurn:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Compose}@db:5432/intellchurn
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MODEL_PATH: /app/ml_pipeline/saved_models/churn_bundle.joblib
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend/ml_pipeline/saved_models:/app/ml_pipeline/saved_models:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
